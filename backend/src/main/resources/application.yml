server:
  port: 8080

spring:
  application:
    name: ksm-fruit-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ksm_fruit}
    username: ${DB_USERNAME:ksm}
    password: ${DB_PASSWORD:ksm}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    suppliers-file: ${SUPPLIERS_XLSX:../data/Таблица 1.xlsx}
    orders-file: ${ORDERS_XLSX:../data/Таблица 2.xlsx}
