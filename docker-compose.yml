services:
  postgres:
    image: postgres:16
    container_name: ksm-fruit-postgres
    environment:
      POSTGRES_DB: ksm_fruit
      POSTGRES_USER: ksm
      POSTGRES_PASSWORD: ksm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksm -d ksm_fruit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ksm-fruit-backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ksm_fruit
      DB_USERNAME: ksm
      DB_PASSWORD: ksm
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ksm-fruit-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
